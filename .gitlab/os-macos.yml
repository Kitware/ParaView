# macOS-specific builder configurations and build commands

---
spec:
    inputs:
        project-tag:
            description: "The project tag to use for selecting runners"

---
## Base configurations

.macos:
    image: "registry.hub.docker.com/kitware/macos-ci-images:macos-26-xcode-16.4-20260710"
    variables:
        GIT_CLONE_PATH: "$CI_BUILDS_DIR/paraview-ci"
        TART_EXECUTOR_HOST_DIR: "false"
        # The default display size is too small for ParaView tests to show all
        # of the widgets necessary for the XML tests to be able to reach
        # widgets reliably.
        TART_EXECUTOR_DISPLAY: "1920x1204"

### Build and test

.macos_arm64_python_qt:
    extends: .macos

    variables:
        CMAKE_CONFIGURATION: macos_arm64_python_qt

.macos_x86_64_python_qt:
    extends: .macos

    variables:
        CMAKE_CONFIGURATION: macos_x86_64_python_qt

## Tags

.macos_x86_64_builder_tags:
    tags:
        - $[[ inputs.project-tag ]]
        - macos-x86_64
        - tart

.macos_arm64_builder_tags:
    tags:
        - $[[ inputs.project-tag ]]
        - macos-arm64
        - tart

## macOS-specific scripts

.before_script_macos: &before_script_macos
    - .gitlab/ci/cmake.sh
    - .gitlab/ci/ninja.sh
    - .gitlab/ci/uv.sh
    - .gitlab/ci/xsltproc.sh
    - export PATH=$PWD/.gitlab:$PWD/.gitlab/cmake/bin:$PWD/.gitlab/xsltproc/bin:$PATH
    - cmake --version
    - ninja --version
    - uv --version
    # Download Qt
    - cmake -P .gitlab/ci/download_qt6.cmake
    - cmake -P .gitlab/ci/download_cdi.cmake
    - cmake -P .gitlab/ci/download_onnxruntime.cmake
    - export CMAKE_PREFIX_PATH=$PWD/.gitlab/qt6:$PWD/.gitlab/cdi:$PWD/.gitlab/onnxruntime
    - git submodule foreach --recursive cmake -P "$PWD/.gitlab/ci/fetch_submodule.cmake"
    - git submodule sync --recursive
    - git submodule update --init --recursive

.cmake_build_macos:
    stage: build
    extends: .warning_policy

    script:
        - *before_script_macos
        - env "CMAKE_CONFIGURATION=macos314_$(uname -m)" cmake -P .gitlab/ci/download_wheel_python.cmake
        - export PYTHON_PREFIX=$GIT_CLONE_PATH/.gitlab/python/Python.framework/Versions/Current
        - export PATH=$GIT_CLONE_PATH/.gitlab/python/Python.framework/Versions/Current/bin:$PATH
        - python3 --version

        - .gitlab/ci/sccache.sh
        # Build and activate the venv
        - python3 -m venv build/ci-venv
        - . ./build/ci-venv/bin/activate
        - python3 -m pip install --upgrade pip
        - pip install -qq -r .gitlab/ci/requirements.txt
        # Allow the server to already be running.
        - "sccache --start-server || :"
        - sccache --show-stats
        - ctest -VV -S .gitlab/ci/ctest_configure.cmake
        - ctest -VV -S .gitlab/ci/ctest_build.cmake &> $GIT_CLONE_PATH/compile_output.log
        - sccache --show-stats
        - exec .gitlab/ci/check_warnings.sh .

    interruptible: true
    timeout: 2 hours

.cmake_test_macos:
    stage: test

    # enable XML tests "stack trace" on failure
    variables:
        PV_DEBUG_TEST: "1"

    script:
        - *before_script_macos
        - env "CMAKE_CONFIGURATION=macos314_$(uname -m)" cmake -P .gitlab/ci/download_wheel_python.cmake
        - export PYTHON_PREFIX=$GIT_CLONE_PATH/.gitlab/python/Python.framework/Versions/Current
        - PYTHON_VERSION_SUFFIX=`"$PYTHON_PREFIX/bin/python3" -c 'import sys;print(f"{sys.version_info[0]}.{sys.version_info[1]}")'`
        # This is set up manually because venv activate does not set
        # PYTHONPATH which is needed for ParaView and pvpython to find the venv packages
        - export PATH=$PWD/build/ci-venv/bin:$PATH
        - export PYTHONPATH=$PWD/build/ci-venv/lib/python$PYTHON_VERSION_SUFFIX/site-packages
        - build/bin/pvpython -c "import numpy"
        - ctest --output-on-failure -V -S .gitlab/ci/ctest_test.cmake
    interruptible: true
    timeout: 2 hours
